<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhtapBot</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f8fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131a22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WhtapBot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24"><path d="M2 13l4 4L14 8"/><path d="M10 15l2 2L22 7"/></svg></span>
      <span>WhtapBot</span>
      <button class="close iconbtn" id="closeNav" aria-label="Close menu"></button>
    </div>
    <nav id="nav"></nav>
    <div class="search"><span id="searchIcon"></span><input id="search" placeholder="Search scheduled messages…" autocomplete="off"></div>
    <div class="filters" id="filters"></div>
    <div class="sidelist" id="sideList"></div>
    <div class="usercard"><span class="avatar" id="meAvatar" style="background:var(--gray)">?</span>
      <div><b id="meName">Not connected</b><small id="meNum">Link WhatsApp to start</small></div></div>
  </aside>

  <section class="main">
    <header class="topbar">
      <button class="menu iconbtn" id="menuBtn" aria-label="Menu"></button>
      <h1 id="viewTitle">Message Planner</h1>
      <div class="pills"><button class="pill" id="connPill"><span class="dot"></span><span class="lbl" id="connText">Connecting…</span></button></div>
    </header>
    <div class="view" id="view"></div>
  </section>
</div>

<nav id="tabbar" class="tabbar" aria-label="Main"></nav>

<dialog id="modal" aria-labelledby="mTitle">
  <form method="dialog" id="mform" novalidate>
    <div class="mhead"><h3 id="mTitle">New message</h3><button type="button" class="iconbtn" id="mClose" aria-label="Close"></button></div>
    <div class="mbody">
      <div id="mStatus"></div>

      <details id="quickBox" class="quick" open>
        <summary>✨ Quick add – type it the way you'd say it</summary>
        <div class="row" style="flex-wrap:nowrap">
          <input id="quick" class="field" placeholder="wish Mom happy birthday every Nov 12 at 9am" autocomplete="off" style="flex:1">
          <button type="button" class="btn soft" id="quickGo">Fill form</button>
        </div>
        <div id="quickNotes" class="notes"></div>
      </details>

      <fieldset id="mFields">
        <label for="pick">Choose a saved contact or group</label>
        <select id="pick" class="field"></select>
        <div class="two">
          <div><label for="to">Phone number (with country code)</label><input id="to" class="field" placeholder="e.g. 14155550100" inputmode="tel" autocomplete="off"></div>
          <div><label for="cname">Name (optional)</label><input id="cname" class="field" placeholder="e.g. Abhilasha" autocomplete="off"></div>
        </div>

        <div class="row" style="justify-content:space-between;margin-top:12px">
          <label for="text" style="margin:0">Message</label>
          <span class="row"><select id="tpl" class="field" style="width:auto;padding:3px 8px;font-size:12px"></select>
            <button type="button" class="chip" id="insName" title="Inserts the contact's first name when sent">+ {name}</button>
            <button type="button" class="chip" id="bdayBtn" title="Yearly repeat with a birthday greeting">🎂 Birthday</button></span>
        </div>
        <textarea id="text" class="field" style="margin-top:4px" maxlength="4000"></textarea>
        <div class="row" style="justify-content:space-between"><span class="hint">Use {name} for the contact's first name. With an attachment this is the caption.</span>
          <span class="hint"><button type="button" class="chip" id="saveTpl">Save as template</button> <span id="count">0</span>/4000</span></div>

        <div id="attachBox" class="attach">
          <input type="file" id="file" hidden>
          <div class="row" style="flex-wrap:nowrap">
            <button type="button" class="btn" id="attachBtn">📎 Attach photo, video, PDF or voice note</button>
            <span id="attachInfo" class="attach-info"></span>
          </div>
          <label id="voiceRow" class="check" hidden><input type="checkbox" id="voice"> Send as a voice note</label>
          <div id="attachWarn" class="hint" style="color:var(--amber)"></div>
        </div>

        <label for="when">Send at</label>
        <input id="when" type="datetime-local" class="field">
        <div class="row chips" style="margin-top:10px" id="chips"></div>

        <label for="repeat">Repeat</label>
        <select id="repeat" class="field">
          <option value="none">Does not repeat</option><option value="daily">Every day</option>
          <option value="weekdays">Every weekday (Mon–Fri)</option><option value="weekly">Every week</option>
          <option value="monthly">Every month</option><option value="yearly">Every year</option>
        </select>
        <div id="endRow" class="two" hidden>
          <div><label for="endType">Ends</label>
            <select id="endType" class="field"><option value="never">Never</option><option value="date">On a date</option><option value="count">After a number of sends</option></select></div>
          <div id="endDateBox" hidden><label for="endDate">Last day</label><input id="endDate" type="date" class="field"></div>
          <div id="endCountBox" hidden><label for="endCount">Total sends</label><input id="endCount" type="number" min="1" max="1000" value="5" class="field"></div>
        </div>

        <details id="moreOpts" class="more-opts">
          <summary>More options <span class="hint">timezone · send window</span></summary>
          <div class="two">
            <div><label for="tz">Timezone</label><select id="tz" class="field"></select></div>
            <div><label for="window">Send window</label>
              <select id="window" class="field">
                <option value="0">Exactly at that time</option><option value="15">Within 15 minutes</option><option value="30">Within 30 minutes</option>
                <option value="60">Within 1 hour</option><option value="120">Within 2 hours</option><option value="180">Within 3 hours</option><option value="240">Within 4 hours</option>
              </select></div>
          </div>
          <div id="windowHint" class="hint"></div>
        </details>
      </fieldset>
      <div class="err" id="mErr" style="margin-top:10px;min-height:1em"></div>
    </div>
    <div class="mfoot" id="mFoot"></div>
  </form>
</dialog>

<script src="nl.js"></script>
<script src="mobile.js"></script>
<script src="app.js"></script>
</body>
</html>
